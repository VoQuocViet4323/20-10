  <!-- ================================================================
         LOGIC THREE.JS VÀ VŨ TRỤ HẠT TƯƠNG TÁC
         ================================================================ -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { createNoise3D, createNoise4D } from 'simplex-noise';

    (async () => {
      const cfg = window.APP_CONFIG;

      // ── KHỞI TẠO ÂM THANH ──
      const bgMusic = new Audio(cfg.bgMusic);
      bgMusic.loop = true;
      bgMusic.volume = cfg.bgVolume || 0.65;
      let isMusicPlaying = false;

      const musicBtn = document.getElementById('music-toggle');
      function updateMusicBtn() {
        if (isMusicPlaying) {
          musicBtn.classList.add('playing');
          musicBtn.textContent = '🎵';
        } else {
          musicBtn.classList.remove('playing');
          musicBtn.textContent = '🔇';
        }
      }

      function startBgMusic() {
        bgMusic.play().then(() => {
          isMusicPlaying = true;
          updateMusicBtn();
        }).catch(e => {
          console.log('Chờ tương tác của người dùng để phát nhạc:', e);
        });
      }

      function toggleBgMusic() {
        if (isMusicPlaying) {
          bgMusic.pause();
          isMusicPlaying = false;
        } else {
          bgMusic.play().then(() => { isMusicPlaying = true; });
        }
        updateMusicBtn();
      }
      musicBtn.addEventListener('click', toggleBgMusic);

      // ── CÁC BIẾN CẤU HÌNH THREE.JS ──
      const isDesktop = window.innerWidth >= 768;
      const PARAMS = {
        particleCount: 25000,
        autoPlayTextCount: 80000,
        backgroundScatterCount: 5000,
        shapeSize: 14,
        textShapeSize: isDesktop ? 22 : 15,
        morphDuration: 2.0,
        imageParticleSizeRange: [0.038, 0.052],
        bloomStrength: 0.85,
        bloomRadius: 0.5,
        bloomThreshold: 0.16
      };

      let scene, camera, renderer, controls, clock;
      let composer, bloomPass;
      let noise3D, noise4D;
      let particlesGeometry, particlesMaterial, particleSystem;
      let backgroundParticleSystem = null, backgroundParticlesGeometry = null, backgroundSourcePositions = null;
      let currentPositions, sourcePositions, targetPositions;
      let particleSizes, particleOpacities, particleEffectStrengths;
      let isInitialized = false;

      const tempVec = new THREE.Vector3();
      const sourceVec = new THREE.Vector3();

      // ── TẠO HẠT TỪ CHỮ VIẾT ──
      function generateFromText(text, count, size) {
        if (!text || !text.trim()) return null;
        const w = 840;
        const maxLineWidth = 720;
        const fontSize = 135;
        const lineHeight = 165;
        const canvasMeasure = document.createElement('canvas');
        const ctx = canvasMeasure.getContext('2d');
        ctx.font = `bold ${fontSize}px "Pacifico", cursive`;

        const words = text.trim().split(/\s+/);
        const lines = [];
        let line = '';
        for (const word of words) {
          const next = line ? line + ' ' + word : word;
          if (ctx.measureText(next).width <= maxLineWidth) {
            line = next;
          } else {
            if (line) lines.push(line);
            line = word;
          }
        }
        if (line) lines.push(line);

        const h = Math.max(300, lines.length * lineHeight + 80);
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx2 = canvas.getContext('2d');
        ctx2.fillStyle = '#000';
        ctx2.fillRect(0, 0, w, h);
        ctx2.fillStyle = '#fff';
        ctx2.font = `bold ${fontSize}px "Pacifico", cursive`;
        ctx2.textAlign = 'center';
        ctx2.textBaseline = 'middle';
        const startY = h / 2 - (lines.length - 1) * (lineHeight / 2);
        lines.forEach((ln, i) => {
          ctx2.fillText(ln, w / 2, startY + i * lineHeight);
        });

        const data = ctx2.getImageData(0, 0, w, h).data;
        const list = [];
        for (let y = 0; y < h; y += 2) {
          for (let x = 0; x < w; x += 2) {
            const idx = (y * w + x) * 4;
            const brightness = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
            if (brightness > 20) list.push({ x, y, brightness, key: y * w + x });
          }
        }
        if (list.length === 0) return null;
        list.sort((a, b) => a.key - b.key);

        const scale = size / Math.max(w, h);
        const cx = w / 2, cy = h / 2;
        const depthScale = size * 0.05;
        const points = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);
        const maxRadius = size * 0.6;
        for (let i = 0; i < count; i++) {
          const idx = Math.min(Math.floor((i * list.length) / count), list.length - 1);
          const p = list[idx];
          const px = (p.x - cx) * scale;
          const py = (cy - p.y) * scale;
          const pz = (p.brightness / 255) * depthScale;
          points[i * 3] = px;
          points[i * 3 + 1] = py;
          points[i * 3 + 2] = pz;

          const dist = Math.sqrt(px * px + py * py + pz * pz);
          const hue = THREE.MathUtils.mapLinear(dist, 0, maxRadius, 335, 360);
          const c = new THREE.Color().setHSL(hue / 360, 0.85, 0.55);
          colors[i * 3] = c.r;
          colors[i * 3 + 1] = c.g;
          colors[i * 3 + 2] = c.b;
        }
        return { positions: points, colors };
      }

      let particleCount = 0;
      let isMorphing = false;
      let morphStartTime = 0;

      function createSharpParticleTexture() {
        const size = 128;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const context = canvas.getContext('2d');
        const gradient = context.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.35, 'rgba(255,255,255,0.95)');
        gradient.addColorStop(0.7, 'rgba(255,255,255,0.5)');
        gradient.addColorStop(0.92, 'rgba(255,255,255,0.12)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        context.fillStyle = gradient;
        context.fillRect(0, 0, size, size);
        return new THREE.CanvasTexture(canvas);
      }

      function rebuildParticleSystemForImage(result) {
        const count = result.positions.length / 3;
        particleCount = count;
        if (particleSystem) {
          scene.remove(particleSystem);
          particlesGeometry.dispose();
          particlesMaterial.dispose();
        }

        currentPositions = new Float32Array(result.positions);
        sourcePositions = new Float32Array(result.positions);
        targetPositions = [new Float32Array(result.positions)];

        particlesGeometry = new THREE.BufferGeometry();
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

        const [minS, maxS] = PARAMS.imageParticleSizeRange;
        particleSizes = new Float32Array(count);
        particleOpacities = new Float32Array(count);
        particleEffectStrengths = new Float32Array(count);
        for (let i = 0; i < count; i++) {
          particleSizes[i] = THREE.MathUtils.randFloat(minS, maxS);
          particleOpacities[i] = 1.0;
          particleEffectStrengths[i] = 0.0;
        }
        particlesGeometry.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));
        particlesGeometry.setAttribute('opacity', new THREE.BufferAttribute(particleOpacities, 1));
        particlesGeometry.setAttribute('aEffectStrength', new THREE.BufferAttribute(particleEffectStrengths, 1));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(result.colors, 3));

        particlesMaterial = new THREE.ShaderMaterial({
          uniforms: { pointTexture: { value: createSharpParticleTexture() } },
          vertexShader: `
                        attribute float size; attribute float opacity; attribute float aEffectStrength;
                        varying vec3 vColor; varying float vOpacity; varying float vEffectStrength;
                        void main() {
                            vColor = color; vOpacity = opacity; vEffectStrength = aEffectStrength;
                            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                            float sizeScale = 1.0 - vEffectStrength * 0.5;
                            gl_PointSize = size * sizeScale * (650.0 / -mvPosition.z);
                            gl_Position = projectionMatrix * mvPosition;
                        }`,
          fragmentShader: `
                        uniform sampler2D pointTexture;
                        varying vec3 vColor; varying float vOpacity; varying float vEffectStrength;
                        void main() {
                            float alpha = texture2D(pointTexture, gl_PointCoord).a;
                            if (alpha < 0.05) discard;
                            gl_FragColor = vec4(vColor, alpha * vOpacity);
                        }`,
          blending: THREE.NormalBlending,
          depthTest: true,
          depthWrite: false,
          transparent: true,
          vertexColors: true
        });

        particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particleSystem);
      }

      function startMorphToResult(result) {
        const count = result.positions.length / 3;
        const positions = particlesGeometry.attributes.position.array;
        sourcePositions = new Float32Array(positions);
        targetPositions = [new Float32Array(result.positions)];
        particlesGeometry.attributes.color.array.set(result.colors);
        particlesGeometry.attributes.color.needsUpdate = true;
        isMorphing = true;
        morphStartTime = clock.getElapsedTime();
      }

      function createBackgroundScatterLayer() {
        const count = PARAMS.backgroundScatterCount;
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);
        const [minS, maxS] = PARAMS.imageParticleSizeRange;
        const sizes = new Float32Array(count);
        const opacities = new Float32Array(count);
        const effectStrengths = new Float32Array(count);
        for (let i = 0; i < count; i++) {
          const i3 = i * 3;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          const r = 4 + Math.random() * 15;
          positions[i3] = r * Math.sin(phi) * Math.cos(theta);
          positions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
          positions[i3 + 2] = r * Math.cos(phi);
          const hue = 330 + Math.random() * 30;
          const c = new THREE.Color().setHSL(hue / 360, 0.8, 0.5 + Math.random() * 0.2);
          colors[i3] = c.r; colors[i3 + 1] = c.g; colors[i3 + 2] = c.b;
          sizes[i] = THREE.MathUtils.randFloat(minS * 0.8, maxS * 0.8);
          opacities[i] = 0.85;
          effectStrengths[i] = 0;
        }
        backgroundSourcePositions = new Float32Array(positions);
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
        geo.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));
        geo.setAttribute('aEffectStrength', new THREE.BufferAttribute(effectStrengths, 1));

        const mat = new THREE.ShaderMaterial({
          uniforms: { pointTexture: { value: createSharpParticleTexture() } },
          vertexShader: `
                        attribute float size; attribute float opacity; attribute float aEffectStrength;
                        varying vec3 vColor; varying float vOpacity; varying float vEffectStrength;
                        void main() {
                            vColor = color; vOpacity = opacity; vEffectStrength = aEffectStrength;
                            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                            gl_PointSize = size * (650.0 / -mvPosition.z);
                            gl_Position = projectionMatrix * mvPosition;
                        }`,
          fragmentShader: `
                        uniform sampler2D pointTexture;
                        varying vec3 vColor; varying float vOpacity;
                        void main() {
                            float alpha = texture2D(pointTexture, gl_PointCoord).a;
                            if (alpha < 0.05) discard;
                            gl_FragColor = vec4(vColor, alpha * vOpacity);
                        }`,
          blending: THREE.NormalBlending, depthTest: true, depthWrite: false, transparent: true, vertexColors: true
        });
        backgroundParticlesGeometry = geo;
        backgroundParticleSystem = new THREE.Points(geo, mat);
        backgroundParticleSystem.renderOrder = -1;
        scene.add(backgroundParticleSystem);
      }

      function initScatterParticles() {
        const count = PARAMS.autoPlayTextCount;
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
          const i3 = i * 3;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          const r = 3 + Math.random() * 14;
          positions[i3] = r * Math.sin(phi) * Math.cos(theta);
          positions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
          positions[i3 + 2] = r * Math.cos(phi);
          const hue = 330 + Math.random() * 30;
          const c = new THREE.Color().setHSL(hue / 360, 0.8, 0.5 + Math.random() * 0.2);
          colors[i3] = c.r; colors[i3 + 1] = c.g; colors[i3 + 2] = c.b;
        }
        createBackgroundScatterLayer();
        bloomPass.strength = 0.55;
        bloomPass.threshold = 0.1;
        rebuildParticleSystemForImage({ positions, colors });
      }

      // ── QUẢ CẦU ẢNH 3D (SPHERE PHASE) ──
      const SP_RADIUS = 6, SP_ROWS = 6, SP_POLAR_MARGIN = 0.15;
      const SP_INTRO_RADIUS = 16, SP_INTRO_DURATION_MS = 2800, SP_INTRO_STAGGER_MS = 900;
      const SP_FLYOUT_BOUND = 10, SP_RAIN_SPEED = 0.025, SP_RAIN_COUNT = 450;
      const isMobileSP = window.innerWidth < 768;

      let spPhase = false, spGroup = null, spMeshes = [], spTextures = [];
      let spIntroStartTime = 0, spIntroComplete = false, spIntroCompleteTime = 0;
      let spClickSphere = null, spRaycaster = null, spMouse = null;
      let spHasZoomedIn = false, spNeedZoomIn = false, spZoomInTime = 0;
      const spZoomInTarget = new THREE.Vector3();
      let spIsExploded = false, spExplosionProgress = 0, spExplosionStartTime = 0;
      let spFadeProgress = 0, spFloatingImages = [], spFloatingGroup = null;
      let spDriftTiltAngle = 0, spDriftTiltDir = 1;
      let spIsFinalFlyUp = false;
      let spTime = 0, spParticlesMesh = null, spRainMesh = null, spRainPositions = null;
      let spIsPointerDown = false, spWasDrag = false, spMouseDownX = 0, spMouseDownY = 0;

      let cupidLetterState = 'hidden';
      let cupidFlyStartTime = 0;
      const CUPID_FLY_DURATION_MS = 2000;

      function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

      function createDiverseFallbackTextures() {
        const titles = ['Minh Khuê 💕', '20/10 ✨', 'Yêu Em ❤️', 'Xinh Đẹp 🌸'];
        const colors = [
          ['#ff758c', '#ff7eb3'],
          ['#f857a6', '#ff5858'],
          ['#ff9a9e', '#fecfef'],
          ['#a18cd1', '#fbc2eb']
        ];
        return titles.map((title, i) => {
          const c = document.createElement('canvas'); c.width = c.height = 300;
          const ctx = c.getContext('2d');
          const grad = ctx.createLinearGradient(0, 0, 300, 300);
          grad.addColorStop(0, colors[i % colors.length][0]);
          grad.addColorStop(1, colors[i % colors.length][1]);
          ctx.fillStyle = grad; ctx.fillRect(0, 0, 300, 300);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 36px "Pacifico", cursive';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(title, 150, 150);
          const tex = new THREE.CanvasTexture(c);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.isFallback = true;
          return tex;
        });
      }

      function applyTexturesToExistingMeshes(textures) {
        if (!textures || !textures.length) return;
        textures.forEach(t => { t.colorSpace = THREE.SRGBColorSpace; });
        spTextures = textures;
        if (spMeshes && spMeshes.length > 0) {
          spMeshes.forEach((mesh, idx) => {
            if (mesh.material) {
              mesh.material.map = textures[idx % textures.length];
              mesh.material.needsUpdate = true;
            }
          });
        }
        if (spFloatingImages && spFloatingImages.length > 0) {
          spFloatingImages.forEach((ig, idx) => {
            if (ig.userData && ig.userData.iMat) {
              ig.userData.iMat.map = textures[idx % textures.length];
              ig.userData.iMat.needsUpdate = true;
            }
          });
        }
      }

      // Tải trước textures thật từ Base64 offline hoặc đường dẫn ảnh ngay khi script khởi động
      const spPhotoLoader = new THREE.TextureLoader();
      const spImageSources = (window.SPHERE_PHOTO_DATA && window.SPHERE_PHOTO_DATA.length)
        ? window.SPHERE_PHOTO_DATA
        : (cfg.sphereImages && cfg.sphereImages.length ? cfg.sphereImages : ['photos/1.jpg', 'photos/2.jpg', 'photos/3.jpg', 'photos/bouquet.jpg']);

      spTextures = spImageSources.map(url => {
        const tex = spPhotoLoader.load(url, t => {
          if (t) {
            t.colorSpace = THREE.SRGBColorSpace;
            t.needsUpdate = true;
          }
        });
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      });

      function spCreatePatch(r, t0, t1, p0, p1, ws, hs) {
        const geo = new THREE.BufferGeometry();
        const verts = [], uvs = [], idx = [];
        for (let y = 0; y <= hs; y++) {
          const v = y / hs, phi = p0 + v * (p1 - p0);
          for (let x = 0; x <= ws; x++) {
            const u = x / ws, theta = t0 + u * (t1 - t0);
            verts.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
            uvs.push(1 - u, 1 - v);
          }
        }
        for (let y = 0; y < hs; y++) for (let x = 0; x < ws; x++) {
          const a = y * (ws + 1) + x, b = a + 1, c = a + (ws + 1), d = c + 1;
          idx.push(a, c, b, b, c, d);
        }
        geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geo.setIndex(idx);
        geo.computeVertexNormals();
        return geo;
      }

      function spBuildSphere() {
        let imgIdx = 0;
        const phiStart = Math.PI * SP_POLAR_MARGIN;
        const phiEnd = Math.PI * (1 - SP_POLAR_MARGIN);
        const phiRange = phiEnd - phiStart;
        const len = spTextures.length;

        for (let row = 0; row < SP_ROWS; row++) {
          const p1 = phiStart + (row / SP_ROWS) * phiRange;
          const p2 = phiStart + ((row + 1) / SP_ROWS) * phiRange;
          const pMid = (p1 + p2) / 2;
          const circ = 2 * Math.PI * SP_RADIUS * Math.sin(pMid);
          const imgH = phiRange * SP_RADIUS / SP_ROWS;
          const n = Math.max(3, Math.round(circ / imgH));
          const tStep = (2 * Math.PI) / n;
          for (let col = 0; col < n; col++) {
            const t = col * tStep;
            const tex = spTextures[imgIdx % len];
            imgIdx++;
            const geo = spCreatePatch(SP_RADIUS, t, t + tStep, p1, p2, 10, 10);
            const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, transparent: true, opacity: 1 });
            const mesh = new THREE.Mesh(geo, mat);

            // Vị trí bay từ xa vào
            const thetaRand = Math.random() * Math.PI * 2;
            const phiRand = Math.acos(2 * Math.random() - 1);
            const startPos = new THREE.Vector3(
              SP_INTRO_RADIUS * Math.sin(phiRand) * Math.cos(thetaRand),
              SP_INTRO_RADIUS * Math.cos(phiRand),
              SP_INTRO_RADIUS * Math.sin(phiRand) * Math.sin(thetaRand)
            );
            mesh.userData.introStartPos = startPos;
            mesh.userData.introDelay = Math.random() * SP_INTRO_STAGGER_MS;
            mesh.position.copy(startPos);
            spGroup.add(mesh);
            spMeshes.push(mesh);
          }
        }
        spIntroStartTime = Date.now();
      }

      function spGlowTexture(size) {
        const c = document.createElement('canvas'); c.width = c.height = size;
        const ctx = c.getContext('2d'), cx = size / 2;
        const g = ctx.createRadialGradient(cx, cx, 0, cx, cx, cx);
        g.addColorStop(0, 'rgba(255,105,180,1)');
        g.addColorStop(0.3, 'rgba(255,182,193,0.8)');
        g.addColorStop(0.6, 'rgba(255,105,180,0.3)');
        g.addColorStop(1, 'rgba(255,105,180,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
        return new THREE.CanvasTexture(c);
      }

      function spRoundedRectGeo(w, h, radius) {
        const shape = new THREE.Shape();
        const x = -w / 2, y = -h / 2;
        shape.moveTo(x + radius, y); shape.lineTo(x + w - radius, y);
        shape.quadraticCurveTo(x + w, y, x + w, y + radius);
        shape.lineTo(x + w, y + h - radius);
        shape.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        shape.lineTo(x + radius, y + h);
        shape.quadraticCurveTo(x, y + h, x, y + h - radius);
        shape.lineTo(x, y + radius); shape.quadraticCurveTo(x, y, x + radius, y);
        const geo = new THREE.ShapeGeometry(shape);
        const pos = geo.attributes.position, uvsArr = [];
        for (let i = 0; i < pos.count; i++) uvsArr.push((pos.getX(i) + w / 2) / w, (pos.getY(i) + h / 2) / h);
        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvsArr, 2));
        return geo;
      }

      function spCreateFloatingImages() {
        spFloatingGroup = new THREE.Group();
        scene.add(spFloatingGroup);
        const total = 24, grid = 14, used = [];
        const glowTex = spGlowTexture(128);

        function findPos(size) {
          const d = size * 1.5 + 1.2;
          for (let i = 0; i < 60; i++) {
            const x = (Math.random() - .5) * grid, y = (Math.random() - .5) * grid, z = (Math.random() - .5) * grid;
            if (used.every(p => Math.hypot(x - p.x, y - p.y, z - p.z) >= d)) {
              used.push({ x, y, z });
              return { x, y, z };
            }
          }
          return { x: (Math.random() - .5) * grid, y: (Math.random() - .5) * grid, z: (Math.random() - .5) * grid };
        }

        const len = (spTextures && spTextures.length) ? spTextures.length : 1;

        for (let i = 0; i < total; i++) {
          const tex = spTextures[i % len];
          // Kích thước ảnh to, rõ ràng và viền bo góc tinh tế
          const sv = isMobileSP ? (1.0 + Math.random() * 0.45) : (1.25 + Math.random() * 0.6);
          const w = 1.9 * sv, h = 1.4 * sv, cr = 0.16 * sv;
          const ig = new THREE.Group();

          const gMat = new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
          ig.add(new THREE.Mesh(spRoundedRectGeo(w * 1.35, h * 1.35, cr * 1.35), gMat));

          const iMat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, transparent: true, opacity: 0 });
          ig.add(new THREE.Mesh(spRoundedRectGeo(w, h, cr), iMat));

          const tPhi = Math.acos(2 * Math.random() - 1), tTheta = Math.random() * Math.PI * 2;
          ig.position.set(SP_RADIUS * .5 * Math.sin(tPhi) * Math.cos(tTheta), SP_RADIUS * .5 * Math.cos(tPhi), SP_RADIUS * .5 * Math.sin(tPhi) * Math.sin(tTheta));
          const tp = findPos(Math.max(w, h));
          ig.userData = {
            startPos: ig.position.clone(),
            targetPos: new THREE.Vector3(tp.x, tp.y, tp.z),
            floatSpeedY: 0.28 + Math.random() * 0.25,
            floatAmplY: 0.1 + Math.random() * 0.14,
            floatPhase: Math.random() * Math.PI * 2,
            delay: Math.random() * 0.35,
            basePos: new THREE.Vector3(tp.x, tp.y, tp.z),
            iMat, gMat,
            driftSpeed: 0.001 + Math.random() * 0.0012,
            baseZ: tp.z
          };
          spFloatingGroup.add(ig);
          spFloatingImages.push(ig);
        }
      }

      function spTriggerExplosion() {
        if (spIsExploded) return;
        spIsExploded = true;
        spExplosionProgress = 0;
        spFadeProgress = 0;
        spMeshes.forEach(m => { if (m.material) m.material.transparent = true; });
        spExplosionStartTime = Date.now();
        controls.autoRotate = false;
        controls.enableRotate = true;
        controls.maxDistance = 18;

        spCreateFloatingImages();
        document.getElementById('btn-flying-corner').classList.add('visible');

        const flash = document.createElement('div');
        flash.style.cssText = 'position:fixed;inset:0;background:radial-gradient(circle,rgba(255,105,180,0.85) 0%,transparent 70%);pointer-events:none;z-index:1000;transition:opacity 0.9s;';
        document.body.appendChild(flash);
        setTimeout(() => { flash.style.opacity = '0'; setTimeout(() => flash.remove(), 900); }, 50);
      }

      function spShowHint(text) {
        const el = document.getElementById('sphere-click-hint');
        if (!el) return;
        el.innerText = text;
        el.classList.add('visible');
        setTimeout(() => el.classList.remove('visible'), 3500);
      }

      function spHandleTap(cx, cy) {
        if (spIsExploded || !spIntroComplete) return;
        spMouse.x = (cx / window.innerWidth) * 2 - 1;
        spMouse.y = -(cy / window.innerHeight) * 2 + 1;
        spRaycaster.setFromCamera(spMouse, camera);

        const hits = spRaycaster.intersectObject(spClickSphere);
        if (hits.length > 0) {
          document.getElementById('sphere-click-hint').classList.remove('visible');
          if (!spHasZoomedIn) {
            spHasZoomedIn = true;
            spZoomInTime = Date.now();
            spNeedZoomIn = true;
            const dir = camera.position.clone().sub(controls.target).normalize();
            spZoomInTarget.copy(controls.target).add(dir.multiplyScalar(controls.minDistance + 1));
            spShowHint('Chạm lần nữa nào ✨');
          } else {
            spTriggerExplosion();
          }
        }
      }

      // ── BỨC THƯ TÌNH CUPID ──
      function startCupidLetterSequence() {
        const overlay = document.getElementById('cupid-letter-overlay');
        const cupidImg = document.getElementById('cupid-flying-img');
        const letterFrame = document.getElementById('cupid-letter-frame');
        if (!overlay || !cupidImg || !letterFrame) return;

        cupidLetterState = 'flying';
        cupidFlyStartTime = Date.now();
        overlay.classList.add('visible');
        cupidImg.style.display = 'block';

        const startLeft = window.innerWidth * 0.15;
        const startTop = window.innerHeight * 0.85;
        cupidImg.style.left = startLeft + 'px';
        cupidImg.style.top = startTop + 'px';
        cupidImg.style.opacity = '1';
        cupidImg.style.transition = 'none';

        letterFrame.classList.remove('visible');
        document.getElementById('letter-envelope-img')?.classList.remove('visible');
      }

      function updateCupidFly() {
        if (cupidLetterState !== 'flying') return;
        const elapsed = Date.now() - cupidFlyStartTime;
        const progress = Math.min(1, elapsed / CUPID_FLY_DURATION_MS);
        const eased = 1 - Math.pow(1 - progress, 1.3);
        const cupidImg = document.getElementById('cupid-flying-img');
        if (!cupidImg) return;

        const startLeft = window.innerWidth * 0.15;
        const startTop = window.innerHeight * 0.85;
        const endLeft = window.innerWidth * 0.5;
        const endTop = window.innerHeight * 0.5;

        cupidImg.style.left = (startLeft + (endLeft - startLeft) * eased) + 'px';
        cupidImg.style.top = (startTop + (endTop - startTop) * eased) + 'px';

        if (progress >= 1) {
          cupidLetterState = 'letterImage';
          cupidImg.style.transition = 'opacity 0.4s ease-out';
          cupidImg.style.opacity = '0';
          setTimeout(() => {
            cupidImg.style.display = 'none';
            document.getElementById('letter-envelope-img')?.classList.add('visible');
          }, 400);
        }
      }

      function startLetterTypingEffect(letterContent, cursor) {
        const text = cfg.letter?.text || "Happy Women's Day 20/10!\n\nChúc em luôn xinh đẹp, hạnh phúc và bình an! ❤️";
        const TYPING_SPEED_MS = 40;
        const chars = Array.from(text);
        let currentIndex = 0;

        function typeNextChar() {
          if (currentIndex < chars.length) {
            const char = chars[currentIndex];
            letterContent.insertBefore(document.createTextNode(char), cursor);
            currentIndex++;
            if (char === '\n') {
              cursor.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
            const delay = char === '\n' ? 180 : TYPING_SPEED_MS;
            setTimeout(typeNextChar, delay);
          } else {
            setTimeout(() => {
              if (cursor) cursor.style.display = 'none';
              const wrap = document.getElementById('letterImageWrap');
              const imgEl = document.getElementById('letterInlineImage');
              if (cfg.letter?.image && imgEl) {
                imgEl.src = cfg.letter.image;
                wrap.style.display = 'block';
                requestAnimationFrame(() => {
                  wrap.classList.add('visible');
                  setTimeout(() => {
                    wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                  }, 150);
                });
              }
            }, 300);
          }
        }
        setTimeout(typeNextChar, 250);
      }

      function handleLetterEnvelopeClick() {
        if (cupidLetterState !== 'letterImage') return;
        cupidLetterState = 'showingLetter';
        startBgMusic();

        document.getElementById('letter-envelope-img')?.classList.remove('visible');
        const letterFrame = document.getElementById('cupid-letter-frame');
        const letterContent = document.getElementById('letterContent');
        const letterImageWrap = document.getElementById('letterImageWrap');
        const scrollWrapper = document.getElementById('letterScrollWrapper');

        if (scrollWrapper) scrollWrapper.scrollTop = 0;

        if (letterImageWrap) {
          letterImageWrap.style.display = 'none';
          letterImageWrap.classList.remove('visible');
        }

        if (letterFrame && letterContent) {
          letterContent.textContent = '';
          const cursor = document.createElement('span');
          cursor.className = 'letter-cursor';
          letterContent.appendChild(cursor);
          letterFrame.classList.add('visible');
          startLetterTypingEffect(letterContent, cursor);
        }
      }

      document.getElementById('letter-envelope-img')?.addEventListener('click', handleLetterEnvelopeClick);
      document.getElementById('letterCloseBtn')?.addEventListener('click', () => {
        document.getElementById('cupid-letter-overlay')?.classList.remove('visible');
        cupidLetterState = 'hidden';
      });

      // ── KHỞI CHẠY GIAI ĐOẠN QUẢ CẦU (START SPHERE PHASE) ──
      let spCameraTransitioning = false;
      const spTargetCameraPos = new THREE.Vector3();

      function startSpherePhase() {
        // Chuyển cảnh mượt mà tức thì: KHÔNG màn đen, KHÔNG gián đoạn
        camera.fov = 75;
        camera.updateProjectionMatrix();
        if (isMobileSP) {
          spTargetCameraPos.set(0, 0, 16);
        } else {
          spTargetCameraPos.set(0, 0, 11);
        }
        spCameraTransitioning = true;
        controls.target.set(0, 0, 0);
        controls.enableRotate = true;
        controls.enableZoom = true;
        controls.enablePan = false;
        controls.minDistance = isMobileSP ? 5.5 : 6;
        controls.maxDistance = isMobileSP ? 26 : 20;
        controls.minPolarAngle = Math.PI * 0.2;
        controls.maxPolarAngle = Math.PI * 0.8;
        controls.update();

        // Dọn dẹp hệ thống hạt cũ sau 2.2s khi các hạt nổ đã bay rộng ra ngoài tầm mắt
        setTimeout(() => {
          if (particleSystem) {
            scene.remove(particleSystem);
            if (particlesGeometry) particlesGeometry.dispose();
            if (particlesMaterial) particlesMaterial.dispose();
            particleSystem = null;
            particleCount = 0;
          }
          if (backgroundParticleSystem) {
            scene.remove(backgroundParticleSystem);
            if (backgroundParticlesGeometry) backgroundParticlesGeometry.dispose();
            backgroundParticleSystem = null;
          }
        }, 2200);

        scene.fog = null;
        scene.background = new THREE.Color(0x000000);
        bloomPass.strength = 0;
        bloomPass.threshold = 1;
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const startWrap = document.getElementById('start-wrap');
        if (startWrap) startWrap.style.display = 'none';

        spGroup = new THREE.Group();
        scene.add(spGroup);

        spClickSphere = new THREE.Mesh(
          new THREE.SphereGeometry(SP_RADIUS * 1.15, 32, 32),
          new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
        );
        scene.add(spClickSphere);
        spRaycaster = new THREE.Raycaster();
        spMouse = new THREE.Vector2();

        // Hào quang hạt quanh quả cầu
        const sCnt = 500, sPos = new Float32Array(sCnt * 3), sCol = new Float32Array(sCnt * 3);
        for (let i = 0; i < sCnt; i++) {
          const t2 = Math.random() * Math.PI * 2, p2 = Math.acos(2 * Math.random() - 1);
          const r2 = SP_RADIUS * 1.25 + Math.random() * 3.5;
          sPos[i * 3] = r2 * Math.sin(p2) * Math.cos(t2);
          sPos[i * 3 + 1] = r2 * Math.cos(p2);
          sPos[i * 3 + 2] = r2 * Math.sin(p2) * Math.sin(t2);
          sCol[i * 3] = 1; sCol[i * 3 + 1] = 0.5 + Math.random() * 0.3; sCol[i * 3 + 2] = 0.7 + Math.random() * 0.3;
        }
        const sGeo = new THREE.BufferGeometry();
        sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
        sGeo.setAttribute('color', new THREE.BufferAttribute(sCol, 3));
        spParticlesMesh = new THREE.Points(sGeo, new THREE.PointsMaterial({ size: 0.045, vertexColors: true, transparent: true, opacity: 0.85 }));
        scene.add(spParticlesMesh);

        // Mưa sao hạt bay ngược
        const rPos = new Float32Array(SP_RAIN_COUNT * 3), rCol = new Float32Array(SP_RAIN_COUNT * 3);
        for (let i = 0; i < SP_RAIN_COUNT; i++) {
          rPos[i * 3] = (Math.random() - .5) * 2 * SP_FLYOUT_BOUND;
          rPos[i * 3 + 1] = -SP_FLYOUT_BOUND + Math.random() * 2 * SP_FLYOUT_BOUND;
          rPos[i * 3 + 2] = (Math.random() - .5) * 2 * SP_FLYOUT_BOUND;
          rCol[i * 3] = 1; rCol[i * 3 + 1] = 0.5 + Math.random() * 0.3; rCol[i * 3 + 2] = 0.8;
        }
        spRainPositions = rPos;
        const rGeo = new THREE.BufferGeometry();
        rGeo.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
        rGeo.setAttribute('color', new THREE.BufferAttribute(rCol, 3));
        spRainMesh = new THREE.Points(rGeo, new THREE.PointsMaterial({ size: 0.04, vertexColors: true, transparent: true, opacity: 0.75 }));
        scene.add(spRainMesh);

        // Particles nền CSS
        const bg = document.getElementById('sphere-particles-bg');
        if (bg) {
          bg.innerHTML = '';
          for (let i = 0; i < 28; i++) {
            const d = document.createElement('div');
            d.className = 'sp-particle';
            d.style.left = Math.random() * 100 + '%';
            d.style.animationDelay = Math.random() * 14 + 's';
            d.style.animationDuration = (10 + Math.random() * 10) + 's';
            bg.appendChild(d);
          }
          bg.style.opacity = '1';
        }

        // Dựng quả cầu 3D với textures ảnh thật đã nạp sẵn
        function doBuildSphere() {
          const hasRealTextures = spTextures && spTextures.length > 0 && !spTextures[0].isFallback;
          if (!hasRealTextures) {
            const sources = (window.SPHERE_PHOTO_DATA && window.SPHERE_PHOTO_DATA.length)
              ? window.SPHERE_PHOTO_DATA
              : (cfg.sphereImages && cfg.sphereImages.length ? cfg.sphereImages : ['photos/1.jpg', 'photos/2.jpg', 'photos/3.jpg', 'photos/bouquet.jpg']);
            if (sources.length > 0) {
              const ldr = new THREE.TextureLoader();
              spTextures = sources.map(u => {
                const t = ldr.load(u, tex => {
                  if (tex) {
                    tex.colorSpace = THREE.SRGBColorSpace;
                    tex.needsUpdate = true;
                  }
                });
                t.colorSpace = THREE.SRGBColorSpace;
                return t;
              });
            } else {
              spTextures = createDiverseFallbackTextures();
            }
          }
          spTextures.forEach(t => { t.colorSpace = THREE.SRGBColorSpace; });
          spBuildSphere();
          spPhase = true;

          setTimeout(() => { spShowHint('Chạm vào quả cầu nhé ✨'); }, 1500);
        }

        // Dựng quả cầu ngay lập tức, hoàn toàn không trễ
        doBuildSphere();

        // Bắt sự kiện tương tác
        const canvasEl = renderer.domElement;
        function spDown(e) {
          const c = e.touches?.[0] || e;
          spMouseDownX = c.clientX; spMouseDownY = c.clientY;
          spIsPointerDown = true; spWasDrag = false;
        }
        function spMove(e) {
          const c = e.touches?.[0] || e;
          if (spIsPointerDown && Math.hypot(c.clientX - spMouseDownX, c.clientY - spMouseDownY) > 6) {
            spWasDrag = true;
          }
        }
        function spUp() { spIsPointerDown = false; }

        canvasEl.addEventListener('mousedown', spDown);
        canvasEl.addEventListener('mouseup', spUp);
        canvasEl.addEventListener('mousemove', spMove);
        canvasEl.addEventListener('click', e => { if (!spWasDrag) spHandleTap(e.clientX, e.clientY); });
        canvasEl.addEventListener('touchstart', spDown, { passive: true });
        canvasEl.addEventListener('touchmove', spMove, { passive: true });
        canvasEl.addEventListener('touchend', e => {
          spUp();
          if (!spWasDrag) {
            const c = e.changedTouches[0];
            spHandleTap(c.clientX, c.clientY);
          }
        });

        document.getElementById('btn-flying-corner')?.addEventListener('click', () => {
          startCupidLetterSequence();
        });
      }

      // ── CẬP NHẬT MỖI FRAME CỦA QUẢ CẦU ──
      function updateSpherePhase() {
        spTime += 0.01;

        if (spRainMesh && spRainPositions) {
          const n = spRainPositions.length / 3;
          for (let j = 0; j < n; j++) {
            spRainPositions[j * 3 + 1] += SP_RAIN_SPEED;
            if (spRainPositions[j * 3 + 1] > 6) {
              spRainPositions[j * 3 + 1] = -SP_FLYOUT_BOUND;
              spRainPositions[j * 3] = (Math.random() - .5) * 2 * SP_FLYOUT_BOUND;
              spRainPositions[j * 3 + 2] = (Math.random() - .5) * 2 * SP_FLYOUT_BOUND;
            }
          }
          spRainMesh.geometry.attributes.position.needsUpdate = true;
        }

        if (spIsExploded) {
          spExplosionProgress = Math.min(1, spExplosionProgress + 0.016);
          spFadeProgress = Math.min(1, spFadeProgress + 0.035);
          spGroup.children.forEach(child => {
            if (child.material) {
              child.material.opacity = Math.max(0, 1 - spFadeProgress);
              if (child.material.opacity <= 0) child.visible = false;
            }
          });
          spClickSphere.visible = false;

          if (spFloatingGroup) {
            spDriftTiltAngle += spDriftTiltDir * 0.00025;
            if (spDriftTiltAngle >= 0.2) { spDriftTiltAngle = 0.2; spDriftTiltDir = -1; }
            else if (spDriftTiltAngle <= -0.2) { spDriftTiltAngle = -0.2; spDriftTiltDir = 1; }
            spFloatingGroup.rotation.y = spDriftTiltAngle;
          }

          const maxY = 13, minY = -13;
          spFloatingImages.forEach((img, idx) => {
            const d = img.userData;
            const dp = Math.max(0, (spExplosionProgress - d.delay) / (1 - d.delay));
            if (dp > 0) {
              const t = Math.min(1, dp), eased = 1 - Math.pow(1 - t, 2);
              const fY = Math.sin(spTime * d.floatSpeedY + d.floatPhase) * d.floatAmplY;
              // Tốc độ bay lên nhanh, liên tục và cuốn hút
              d.basePos.y += d.driftSpeed * 6.0;

              if (eased < 1) {
                img.position.x = d.startPos.x + (d.targetPos.x - d.startPos.x) * eased;
                img.position.z = d.startPos.z + (d.targetPos.z - d.startPos.z) * eased;
                img.position.y = d.startPos.y + (d.targetPos.y - d.startPos.y) * eased + (d.basePos.y - d.targetPos.y) + fY;
              } else {
                img.position.x = d.basePos.x;
                img.position.y = d.basePos.y + fY;
                img.position.z = d.baseZ;
              }

              if (d.basePos.y > maxY) {
                d.basePos.y = minY;
                d.basePos.x = (Math.random() - .5) * 14;
                d.baseZ = (Math.random() - .5) * 14;
              }

              const op = Math.min(1, dp * 1.8);
              d.iMat.opacity = op;
              if (d.gMat) d.gMat.opacity = op * (0.65 + Math.sin(spTime * 1.5 + idx * 0.5) * 0.25);
            }
          });
        } else if (spIntroComplete) {
          if (spNeedZoomIn) {
            camera.position.lerp(spZoomInTarget, 0.08);
            if (camera.position.distanceTo(controls.target) <= controls.minDistance + 0.1) {
              spNeedZoomIn = false;
            }
          }
          spGroup.rotation.y += 0.0015;
          if (spParticlesMesh) {
            spParticlesMesh.rotation.y += 0.0006;
            spParticlesMesh.rotation.x += 0.0003;
          }
        }

        // Chuyển động ráp mảnh từ xa vào
        if (!spIntroComplete && spIntroStartTime > 0 && spMeshes.length > 0) {
          const elapsed = Date.now() - spIntroStartTime, dur = SP_INTRO_DURATION_MS / 1000;
          spMeshes.forEach(mesh => {
            const delay = (mesh.userData.introDelay || 0) / 1000;
            const t = Math.min(1, Math.max(0, (elapsed / 1000 - delay) / dur));
            const eased = 1 - Math.pow(1 - t, 1.4);
            mesh.position.lerpVectors(mesh.userData.introStartPos, new THREE.Vector3(0, 0, 0), eased);
          });
          if (elapsed > SP_INTRO_DURATION_MS + SP_INTRO_STAGGER_MS) {
            spIntroComplete = true;
            spIntroCompleteTime = Date.now();
            spMeshes.forEach(m => { m.position.set(0, 0, 0); });
          }
        }
      }

      // ── VỤ NỔ SIÊU TÂN TINH (SUPERNOVA EXPLOSION) ──
      let isExploding = false;
      let explodeStartTime = 0;
      let explodeVelocities = null;
      let explodeStartPositions = null;

      function triggerExplosion() {
        if (!particleSystem || particleCount === 0) return;
        isMorphing = false;
        isExploding = true;
        explodeStartTime = clock.getElapsedTime();
        explodeVelocities = new Float32Array(particleCount * 3);
        explodeStartPositions = new Float32Array(sourcePositions);
        for (let i = 0; i < particleCount; i++) {
          const i3 = i * 3;
          const dir = new THREE.Vector3(
            (Math.random() - 0.5) * 2,
            (Math.random() - 0.5) * 2,
            (Math.random() - 0.2) * 2
          ).normalize();
          const speed = 5 + Math.random() * 16;
          explodeVelocities[i3] = dir.x * speed;
          explodeVelocities[i3 + 1] = dir.y * speed;
          explodeVelocities[i3 + 2] = dir.z * speed;
        }
      }

      function showText(text) {
        const result = generateFromText(text, PARAMS.autoPlayTextCount, PARAMS.textShapeSize);
        if (!result) return;
        bloomPass.strength = 0.32;
        bloomPass.threshold = 0.35;
        if (particleSystem && particleCount === result.positions.length / 3) {
          startMorphToResult(result);
        } else {
          rebuildParticleSystemForImage(result);
        }
      }

      // ── CHU TRÌNH TỰ ĐỘNG CHẠY VŨ TRỤ (AUTOPLAY) ──
      async function startAutoPlay() {
        try {
          startBgMusic();
        } catch (e) { }

        try {
          const morphTexts = (cfg.morphTexts && cfg.morphTexts.length) ? cfg.morphTexts : ['Chúc Mừng', '20/10', 'Minh Khuê 💕'];
          for (let i = 0; i < morphTexts.length; i++) {
            showText(morphTexts[i]);
            // Chữ cuối "Minh Khuê 💕" giữ 2.8s cho người xem ngắm, các chữ trước 2.3s
            await sleep(i === morphTexts.length - 1 ? 2800 : 2300);
          }
        } catch (err) {
          console.error('Lỗi trong chuỗi text:', err);
        }

        // Chuyển cảnh tức thì 100%: Nổ hạt bừng sáng và bắt đầu ráp Quả Cầu 3D mượt mà
        try {
          triggerExplosion();
          startSpherePhase();
        } catch (e) {
          console.error('Lỗi chuyển cảnh quả cầu:', e);
        }
      }

      // ── CHUẨN BỊ VÀ HIỆN NÚT GIỮ ──
      async function prepareAndWait() {
        try {
          await Promise.race([
            document.fonts.load('135px "Pacifico"'),
            sleep(1200)
          ]);
        } catch (e) { }

        // Tải trước textures cho Quả Cầu 3D ngay từ đầu để sẵn sàng chuyển cảnh tức thì
        const loader = new THREE.TextureLoader();
        const sphereImgs = (window.SPHERE_PHOTO_DATA && window.SPHERE_PHOTO_DATA.length)
          ? window.SPHERE_PHOTO_DATA
          : (cfg.sphereImages && cfg.sphereImages.length ? cfg.sphereImages : ['photos/1.jpg', 'photos/2.jpg', 'photos/3.jpg', 'photos/bouquet.jpg']);
        const loadSingleTex = (url) => new Promise(resolve => {
          loader.load(url, tex => {
            if (tex) {
              tex.colorSpace = THREE.SRGBColorSpace;
              tex.needsUpdate = true;
            }
            resolve(tex);
          }, undefined, () => resolve(null));
        });
        Promise.all(sphereImgs.map(loadSingleTex)).then(textures => {
          const valid = textures.filter(t => t !== null);
          if (valid.length > 0) {
            applyTexturesToExistingMeshes(valid);
          }
        }).catch(err => {
          console.warn('Preload textures warning:', err);
        });

        initScatterParticles();

        const wrap = document.getElementById('start-wrap');
        const ringFill = document.getElementById('ring-fill');
        wrap.style.display = 'flex';

        let holdTimer = null;
        let holdStartTime = 0;
        const HOLD_MS = 600;
        let triggered = false;

        function triggerStart() {
          if (triggered) return;
          triggered = true;
          if (holdTimer) {
            clearInterval(holdTimer);
            holdTimer = null;
          }
          try { startBgMusic(); } catch (_) { }
          wrap.classList.add('held');
          ringFill.style.transition = 'stroke-dashoffset 0.2s ease-out';
          ringFill.style.strokeDashoffset = '0';
          setTimeout(() => {
            wrap.style.display = 'none';
            startAutoPlay();
          }, 220);
        }

        function onDown(e) {
          if (triggered) return;
          if (e && e.pointerId && wrap.setPointerCapture) {
            try { wrap.setPointerCapture(e.pointerId); } catch (_) { }
          }
          try { startBgMusic(); } catch (_) { }
          if (holdTimer) {
            clearInterval(holdTimer);
            holdTimer = null;
          }
          holdStartTime = Date.now();
          ringFill.style.transition = 'stroke-dashoffset 0.6s linear';
          ringFill.style.strokeDashoffset = '163.36';
          void ringFill.offsetHeight;
          ringFill.style.strokeDashoffset = '0';

          holdTimer = setInterval(function () {
            const elapsed = Date.now() - holdStartTime;
            if (elapsed >= 250) wrap.classList.add('held');
            if (elapsed >= HOLD_MS) {
              triggerStart();
            }
          }, 35);
        }

        function onUp(e) {
          if (triggered) return;
          const elapsed = Date.now() - holdStartTime;
          // Người dùng đã nhấn giữ hoặc chạm vào nút -> kích hoạt ngay mượt mà
          if (elapsed >= 80 || holdStartTime > 0) {
            triggerStart();
          } else {
            if (holdTimer) {
              clearInterval(holdTimer);
              holdTimer = null;
            }
            wrap.classList.remove('held');
            ringFill.style.transition = 'stroke-dashoffset 0.25s ease';
            ringFill.style.strokeDashoffset = '163.36';
          }
        }

        wrap.addEventListener('pointerdown', onDown);
        wrap.addEventListener('pointerup', onUp);
        wrap.addEventListener('click', (e) => {
          e.preventDefault();
          triggerStart();
        });
      }

      // ── VÒNG LẶP RENDER CHÍNH (ANIMATE) ──
      function animate() {
        requestAnimationFrame(animate);
        if (!isInitialized) return;

        const elapsedTime = clock.getElapsedTime();
        const deltaTime = clock.getDelta();
        controls.update();

        if (particlesGeometry && particleCount > 0) {
          const positions = particlesGeometry.attributes.position.array;
          if (isExploding && explodeVelocities && explodeStartPositions) {
            const t = elapsedTime - explodeStartTime;
            for (let i = 0; i < particleCount; i++) {
              const i3 = i * 3;
              positions[i3] = explodeStartPositions[i3] + explodeVelocities[i3] * t;
              positions[i3 + 1] = explodeStartPositions[i3 + 1] + explodeVelocities[i3 + 1] * t;
              positions[i3 + 2] = explodeStartPositions[i3 + 2] + explodeVelocities[i3 + 2] * t;
            }
          } else if (isMorphing && targetPositions && targetPositions[0]) {
            const t = Math.min(1, (elapsedTime - morphStartTime) / PARAMS.morphDuration);
            const smoothT = t * t * (3 - 2 * t);
            const target = targetPositions[0];
            for (let i = 0; i < particleCount; i++) {
              const i3 = i * 3;
              positions[i3] = sourcePositions[i3] + (target[i3] - sourcePositions[i3]) * smoothT;
              positions[i3 + 1] = sourcePositions[i3 + 1] + (target[i3 + 1] - sourcePositions[i3 + 1]) * smoothT;
              positions[i3 + 2] = sourcePositions[i3 + 2] + (target[i3 + 2] - sourcePositions[i3 + 2]) * smoothT;
            }
            if (t >= 1) {
              isMorphing = false;
              sourcePositions = new Float32Array(target);
            }
          } else {
            // Sóng trôi bồng bềnh
            for (let i = 0; i < particleCount; i++) {
              const i3 = i * 3;
              sourceVec.fromArray(sourcePositions, i3);
              positions[i3] = sourceVec.x + noise3D(sourceVec.x * 0.35, sourceVec.y * 0.35, elapsedTime * 0.16) * 0.22;
              positions[i3 + 1] = sourceVec.y + noise3D(sourceVec.y * 0.35, sourceVec.z * 0.35, elapsedTime * 0.16) * 0.22;
              positions[i3 + 2] = sourceVec.z + noise3D(sourceVec.z * 0.35, sourceVec.x * 0.35, elapsedTime * 0.16) * 0.22;
            }
          }
          particlesGeometry.attributes.position.needsUpdate = true;
        }

        if (backgroundParticlesGeometry && backgroundSourcePositions) {
          const pos = backgroundParticlesGeometry.attributes.position.array;
          for (let i = 0; i < PARAMS.backgroundScatterCount; i++) {
            const i3 = i * 3;
            sourceVec.fromArray(backgroundSourcePositions, i3);
            pos[i3] = sourceVec.x + noise3D(sourceVec.x * 0.4, sourceVec.y * 0.4, elapsedTime * 0.18) * 0.2;
            pos[i3 + 1] = sourceVec.y + noise3D(sourceVec.y * 0.4, sourceVec.z * 0.4, elapsedTime * 0.18) * 0.2;
            pos[i3 + 2] = sourceVec.z + noise3D(sourceVec.z * 0.4, sourceVec.x * 0.4, elapsedTime * 0.18) * 0.2;
          }
          backgroundParticlesGeometry.attributes.position.needsUpdate = true;
        }

        if (spCameraTransitioning) {
          camera.position.lerp(spTargetCameraPos, 0.05);
          controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.08);
          if (camera.position.distanceTo(spTargetCameraPos) < 0.15) {
            camera.position.copy(spTargetCameraPos);
            controls.target.set(0, 0, 0);
            spCameraTransitioning = false;
          }
        }

        if (spPhase) updateSpherePhase();
        if (cupidLetterState === 'flying') updateCupidFly();

        if (spPhase) {
          renderer.render(scene, camera);
        } else {
          composer.render(deltaTime);
        }
      }

      // ── KHỞI TẠO WEBGL & THREE.JS SCENE ──
      function init() {
        const loadingScreen = document.getElementById('loading');
        const progressBar = document.getElementById('progress');

        function updateProgress(val) {
          progressBar.style.width = `${val}%`;
          if (val >= 100) {
            setTimeout(() => {
              loadingScreen.style.opacity = '0';
              setTimeout(() => { loadingScreen.style.display = 'none'; }, 700);
            }, 250);
          }
        }

        clock = new THREE.Clock();
        noise3D = createNoise3D(() => Math.random());
        noise4D = createNoise4D(() => Math.random());

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.03);
        updateProgress(25);

        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        if (isDesktop) {
          camera.position.set(0, 6, 18);
        } else {
          camera.position.set(0, 8, 26);
        }
        camera.lookAt(scene.position);
        updateProgress(50);

        const canvas = document.getElementById('webglCanvas');
        renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 80;
        controls.autoRotate = false;
        updateProgress(75);

        scene.add(new THREE.AmbientLight(0x554050));
        const dirLight1 = new THREE.DirectionalLight(0xfff0f5, 1.4);
        dirLight1.position.set(15, 20, 10);
        scene.add(dirLight1);

        composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        bloomPass = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          PARAMS.bloomStrength,
          PARAMS.bloomRadius,
          PARAMS.bloomThreshold
        );
        composer.addPass(bloomPass);

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
          composer.setSize(window.innerWidth, window.innerHeight);
        });

        updateProgress(100);
        isInitialized = true;
        animate();
        prepareAndWait();
      }

      // ── QUẢN LÝ MẬT KHẨU (PASSCODE SCREEN) ──
      const PASSCODE = cfg.passcode || '3008';
      let passcodeInput = '';

      const passcodeScreen = document.getElementById('passcodeScreen');
      const passcodeDots = document.getElementById('passcodeDots');
      const passcodeBears = document.getElementById('passcodeBears');
      const bearLeft = document.getElementById('bearLeft');
      const bearRight = document.getElementById('bearRight');

      if (cfg.enablePasscode) {
        passcodeScreen.classList.add('visible');
        // Tắt màn hình loading để hiện passcode
        const loadingScreen = document.getElementById('loading');
        loadingScreen.style.opacity = '0';
        setTimeout(() => { loadingScreen.style.display = 'none'; }, 600);
      } else {
        passcodeScreen.style.display = 'none';
        init();
      }

      function updatePasscodeDots() {
        const dots = passcodeDots.querySelectorAll('.passcode-dot');
        dots.forEach((dot, i) => {
          dot.classList.remove('filled', 'error');
          if (i < passcodeInput.length) dot.classList.add('filled');
        });
      }

      function updateBearPosition() {
        const pos = passcodeInput.length;
        bearLeft.className = `passcode-bear left pos-${pos}`;
        bearRight.className = `passcode-bear right pos-${pos}`;
      }

      function showPasscodeError() {
        const dots = passcodeDots.querySelectorAll('.passcode-dot');
        dots.forEach(d => d.classList.add('error'));
        bearLeft.className = 'passcode-bear left pos-0';
        bearRight.className = 'passcode-bear right pos-0';
        setTimeout(() => {
          passcodeInput = '';
          dots.forEach(d => d.classList.remove('filled', 'error'));
        }, 500);
      }

      function openGift() {
        passcodeBears.classList.add('show-couple');
        startBgMusic();
        setTimeout(() => {
          passcodeScreen.classList.add('hiding');
          setTimeout(() => {
            passcodeScreen.classList.remove('visible', 'hiding');
            init();
          }, 500);
        }, 2000);
      }

      document.querySelectorAll('.passcode-btn[data-num]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (passcodeInput.length >= 4) return;
          passcodeInput += btn.dataset.num;
          updatePasscodeDots();
          updateBearPosition();
          if (passcodeInput.length === 4) {
            if (passcodeInput === PASSCODE) {
              openGift();
            } else {
              showPasscodeError();
            }
          }
        });
      });

      document.getElementById('passcodeCancel')?.addEventListener('click', () => {
        passcodeInput = '';
        updatePasscodeDots();
        updateBearPosition();
      });

    })();
  </script>
</body>
