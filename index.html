<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chúc Mừng 20/10 💖">
  <link rel="apple-touch-icon" href="assets/images/icons/couple.png">
  <link rel="icon" type="image/png" href="assets/images/icons/couple.png">
  <meta name="theme-color" content="#1b0a1c">
  <title>Chúc Mừng Ngày 20/10 💖</title>

  <!-- Google Fonts hỗ trợ tiếng Việt trọn vẹn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Dancing+Script:wght@400;600;700&family=Pacifico&family=Quicksand:wght@500;600;700&display=swap">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #000000;
      color: #ffffff;
      font-family: "Pacifico", "Dancing Script", cursive;
      user-select: none;
      -webkit-user-select: none;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    canvas#webglCanvas {
      display: block;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
    }

    /* ── MÀN HÌNH TẢI (LOADING) ── */
    #loading {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #260d23 0%, #0d040c 70%, #000000 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease-out;
    }

    #loading .loading-heart {
      font-size: 52px;
      animation: pulseHeart 1.4s ease-in-out infinite;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 15px rgba(255, 105, 180, 0.7));
    }

    @keyframes pulseHeart {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.18);
      }
    }

    #loading span {
      font-size: 22px;
      letter-spacing: 2px;
      margin-bottom: 18px;
      color: #ffd1dc;
      text-shadow: 0 0 12px rgba(255, 105, 180, 0.6);
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
    }

    #progress-container {
      width: 65%;
      max-width: 280px;
      height: 8px;
      background-color: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 182, 193, 0.2);
    }

    #progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff69b4, #ff85a2, #ffd1dc);
      transition: width 0.35s ease;
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
    }

    /* ── MÀN HÌNH MẬT MÃ (PASSCODE SCREEN) ── */
    #passcodeScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(70, 20, 50, 0.88), rgba(25, 6, 22, 0.94)),
        linear-gradient(160deg, #32102e 0%, #120511 100%);
      z-index: 2000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
      overflow: hidden;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", 'Quicksand', sans-serif;
    }

    #passcodeScreen.visible {
      display: flex;
    }

    #passcodeScreen.hiding {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease-out;
    }

    .passcode-bears {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 180px;
      flex-shrink: 0;
      margin-top: 10px;
    }

    .passcode-bear {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: clamp(140px, 32vw, 200px);
      width: auto;
      object-fit: contain;
      transition: left 0.4s cubic-bezier(0.34, 1.3, 0.64, 1), right 0.4s cubic-bezier(0.34, 1.3, 0.64, 1), opacity 0.3s;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.3));
    }

    .passcode-bear.left {
      left: 5%;
    }

    .passcode-bear.right {
      right: 5%;
      left: auto;
    }

    .passcode-bear.left.pos-0 {
      left: 5%;
    }

    .passcode-bear.right.pos-0 {
      right: 5%;
    }

    .passcode-bear.left.pos-1 {
      left: 12%;
    }

    .passcode-bear.right.pos-1 {
      right: 12%;
    }

    .passcode-bear.left.pos-2 {
      left: 20%;
    }

    .passcode-bear.right.pos-2 {
      right: 20%;
    }

    .passcode-bear.left.pos-3 {
      left: 28%;
    }

    .passcode-bear.right.pos-3 {
      right: 28%;
    }

    .passcode-bear.left.pos-4 {
      left: 36%;
    }

    .passcode-bear.right.pos-4 {
      right: 36%;
    }

    .passcode-couple-img {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      height: clamp(160px, 36vw, 220px);
      width: auto;
      object-fit: contain;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.6s cubic-bezier(0.34, 1.5, 0.64, 1), opacity 0.5s ease;
      filter: drop-shadow(0 8px 24px rgba(255, 105, 180, 0.4));
    }

    .passcode-bears.show-couple .passcode-bear {
      opacity: 0;
    }

    .passcode-bears.show-couple .passcode-couple-img {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.05);
    }

    .passcode-bears.show-couple~.passcode-info-group,
    .passcode-bears.show-couple~.passcode-keypad-wrap {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .hearts-passcode {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .passcode-bears.show-couple~.hearts-passcode {
      opacity: 1;
    }

    .hearts-passcode .heart-fly {
      position: absolute;
      bottom: -50px;
      font-size: 26px;
      animation: heartFloatUp 3.5s linear infinite;
    }

    @keyframes heartFloatUp {
      0% {
        transform: translateY(0) scale(0.7) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: 0.95;
      }

      85% {
        opacity: 0.85;
      }

      100% {
        transform: translateY(-105vh) scale(1.3) rotate(30deg);
        opacity: 0;
      }
    }

    .passcode-info-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }

    .passcode-title {
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
    }

    .passcode-subtitle {
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      margin-bottom: 24px;
      text-align: center;
    }

    .passcode-dots {
      display: flex;
      gap: 16px;
      margin-bottom: 15px;
    }

    .passcode-dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      background: transparent;
      transition: all 0.25s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    .passcode-dot.filled {
      background: #ff758f;
      border-color: #ff758f;
      box-shadow: 0 0 12px #ff758f;
      transform: scale(1.15);
    }

    .passcode-dot.error {
      border-color: #ff4d4f;
      background: #ff4d4f;
      animation: shakeDots 0.4s ease;
    }

    @keyframes shakeDots {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-8px);
      }

      40% {
        transform: translateX(8px);
      }

      60% {
        transform: translateX(-6px);
      }

      80% {
        transform: translateX(6px);
      }
    }

    .passcode-keypad-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 320px;
      margin-bottom: 10px;
    }

    .passcode-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px 24px;
      width: 100%;
    }

    .passcode-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      justify-self: center;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
      color: #ffffff;
      font-size: 28px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .passcode-btn:active {
      background: rgba(255, 117, 143, 0.4);
      transform: scale(0.92);
      box-shadow: 0 2px 8px rgba(255, 105, 180, 0.4);
    }

    .passcode-btn.empty {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      cursor: default;
    }

    .passcode-cancel {
      margin-top: 14px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 15px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 18px;
      font-family: inherit;
      transition: color 0.2s;
    }

    .passcode-cancel:hover {
      color: #ffd1dc;
    }

    /* ── NÚT GIỮ ĐỂ BẮT ĐẦU (START WRAP) ── */
    #start-wrap {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 36px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 250;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      touch-action: none !important;
      -webkit-touch-callout: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      -webkit-tap-highlight-color: transparent !important;
      transition: transform 0.25s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    #start-wrap * {
      pointer-events: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
    }

    #start-wrap.held {
      transform: translateX(-50%) scale(1.1);
    }

    #start-label {
      font-family: "Pacifico", cursive;
      color: rgba(255, 192, 203, 0.95);
      font-size: 15px;
      text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    #start-wrap svg {
      width: 76px;
      height: 76px;
      filter: drop-shadow(0 0 12px rgba(255, 105, 180, 0.6));
    }

    .ring-pulse {
      fill: rgba(255, 105, 180, 0.15);
      animation: ringPulseAnim 2.2s ease-in-out infinite;
    }

    @keyframes ringPulseAnim {

      0%,
      100% {
        opacity: 0.6;
        transform: scale(1);
        transform-origin: center;
      }

      50% {
        opacity: 0.2;
        transform: scale(1.08);
        transform-origin: center;
      }
    }

    .ring-track {
      fill: none;
      stroke: rgba(255, 182, 193, 0.25);
      stroke-width: 3.5;
    }

    .ring-fill {
      fill: none;
      stroke: #ff69b4;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 163.36;
      stroke-dashoffset: 163.36;
      transform-origin: 34px 34px;
      transform: rotate(-90deg);
      transition: stroke-dashoffset 1s linear;
    }

    /* ── GỢI Ý CLICK QUẢ CẦU & NÚT GÓC ── */
    #sphere-click-hint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      padding: 12px 28px;
      background: rgba(20, 5, 18, 0.75);
      color: #ffd1dc;
      font-size: 1.05rem;
      border-radius: 999px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      font-family: "Pacifico", cursive;
      letter-spacing: 1px;
      border: 1px solid rgba(255, 182, 193, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    #sphere-click-hint.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    #btn-flying-corner {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
      right: 24px;
      z-index: 320;
      display: none;
      padding: 12px 20px;
      font-size: 22px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 999px;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(255, 105, 180, 0.5);
      transition: transform 0.25s, box-shadow 0.25s;
      animation: bounceBtn 2s infinite;
    }

    @keyframes bounceBtn {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    #btn-flying-corner.visible {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #btn-flying-corner:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 24px rgba(255, 105, 180, 0.7);
    }

    /* ── NÚT ĐIỀU KHIỂN NHẠC GÓC TRÊN ── */
    #music-toggle {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 16px);
      right: 16px;
      z-index: 999;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(30, 10, 26, 0.65);
      border: 1px solid rgba(255, 182, 193, 0.4);
      color: #ffd1dc;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: all 0.3s ease;
    }

    #music-toggle.playing {
      animation: rotateDisk 4s linear infinite;
      border-color: #ff69b4;
      box-shadow: 0 0 16px rgba(255, 105, 180, 0.6);
    }

    @keyframes rotateDisk {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* ── MÀN HÌNH BỨC THƯ CUPID (CUPID LETTER OVERLAY) ── */
    #cupid-letter-overlay {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 500;
      pointer-events: none;
      background: rgba(10, 2, 8, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #cupid-letter-overlay.visible {
      display: flex;
      pointer-events: auto;
    }

    #cupid-flying-img {
      position: absolute;
      width: clamp(130px, 26vw, 230px);
      height: auto;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 510;
      filter: drop-shadow(0 8px 20px rgba(255, 105, 180, 0.5));
    }

    #letter-envelope-img {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(150px, 32vw, 260px);
      height: auto;
      cursor: pointer;
      display: none;
      z-index: 520;
      transition: transform 0.25s ease;
      filter: drop-shadow(0 12px 30px rgba(255, 105, 180, 0.55));
    }

    #letter-envelope-img.visible {
      display: block;
      animation: envelopeAppear 0.6s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    @keyframes envelopeAppear {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.6) rotate(-15deg);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
    }

    #letter-envelope-img:hover {
      transform: translate(-50%, -50%) scale(1.08);
    }

    #cupid-letter-frame {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 680px);
      max-height: 88vh;
      max-height: 88dvh;
      display: none;
      flex-direction: column;
      z-index: 550;
      border-radius: 20px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 182, 193, 0.4), 0 0 40px rgba(255, 105, 180, 0.3);
      background: linear-gradient(135deg, #fff2f5 0%, #ffe4ec 35%, #fff6f8 65%, #ffd4e0 100%);
      pointer-events: auto;
      overflow: visible;
    }

    #cupid-letter-frame.visible {
      display: flex;
      animation: letterCardAppear 0.6s cubic-bezier(0.34, 1.3, 0.64, 1) forwards;
    }

    @keyframes letterCardAppear {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.85);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .letter-scroll-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-height: 84vh;
      max-height: 84dvh;
      overflow-y: auto;
      overflow-x: hidden;
      padding: clamp(24px, 5vw, 36px) clamp(20px, 4vw, 36px) clamp(30px, 6vw, 45px);
      scrollbar-width: thin;
      scrollbar-color: rgba(216, 74, 111, 0.35) transparent;
      -webkit-overflow-scrolling: touch;
      box-sizing: border-box;
    }

    .letter-scroll-wrapper::-webkit-scrollbar {
      width: 6px;
    }

    .letter-scroll-wrapper::-webkit-scrollbar-track {
      background: transparent;
    }

    .letter-scroll-wrapper::-webkit-scrollbar-thumb {
      background: rgba(216, 74, 111, 0.35);
      border-radius: 10px;
    }

    .letter-content {
      position: relative;
      font-family: "Pacifico", "Dancing Script", -apple-system, serif;
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      color: #7b2850;
      line-height: 1.85;
      letter-spacing: 0.02em;
      text-align: center;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .letter-content .letter-cursor {
      display: inline-block;
      width: 2.5px;
      height: 1.2em;
      background: #d84a6f;
      margin-left: 3px;
      animation: blinkCursor 0.8s infinite;
      vertical-align: text-bottom;
    }

    @keyframes blinkCursor {
      0%,
      50% {
        opacity: 1;
      }

      51%,
      100% {
        opacity: 0;
      }
    }

    .letter-image-wrap {
      margin-top: 1.8rem;
      margin-bottom: 1rem;
      text-align: center;
      position: relative;
      opacity: 0;
      transform: translateY(16px) scale(0.92);
      clear: both;
    }

    .letter-image-wrap.visible {
      animation: letterImgShow 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes letterImgShow {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .letter-inline-image {
      display: block;
      max-width: min(85vw, 360px);
      width: auto;
      max-height: 48vh;
      margin: 0 auto;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(123, 40, 80, 0.22), 0 0 0 5px #ffffff;
      object-fit: cover;
    }

    .letter-image-caption {
      display: none !important;
    }

    .letter-close-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(216, 74, 111, 0.15);
      border: none;
      color: #8b3a62;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s;
    }

    .letter-close-btn:hover {
      background: #d84a6f;
      color: #fff;
      transform: scale(1.1);
    }

    .letter-butterfly-left {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 4;
      pointer-events: none;
      transform: translate(-45%, -45%) rotate(-8deg);
    }

    .letter-butterfly-left img {
      width: clamp(160px, 28vw, 240px);
      height: auto;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.2));
    }

    .letter-butterfly-right {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 4;
      pointer-events: none;
      transform: translate(45%, -45%) rotate(8deg);
    }

    .letter-butterfly-right img {
      width: clamp(90px, 18vw, 150px);
      height: auto;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.2));
    }

    .letter-bottom-bg {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 35%;
      z-index: 1;
      pointer-events: none;
